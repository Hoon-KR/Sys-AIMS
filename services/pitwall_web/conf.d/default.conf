# pitwall_web — 정적 페이지 + 의존 서비스(pitwall_api) 딥 헬스체크
# 장애 시나리오 ①(의존 서비스 연결 실패)의 전제: /healthz 는 pitwall_api 까지 응답해야 200 이다.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker 내장 DNS를 "요청 시점"에 조회한다 (변수 proxy_pass).
    # 기동 시점에 조회하면 pitwall_api 가 없을 때 nginx 자체가 뜨지 않아
    # "의존 서비스 장애"가 "설정 오류"처럼 보이게 된다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $pitwall_api http://pitwall_api:80;

    location / {
        try_files $uri $uri/ =404;
    }

    # 딥 헬스체크: Zabbix HTTP 체크와 Docker healthcheck가 사용
    location = /healthz {
        proxy_pass $pitwall_api/status.json;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
