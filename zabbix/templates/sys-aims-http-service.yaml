zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 2ddb55fe0d5d4d7b82e52b8051eacdb3
      name: Templates/Sys-AIMS
  templates:
    - uuid: 4bf686d9d13742fb8cbc9d06d306b463
      template: 'Sys-AIMS HTTP Service'
      name: 'Sys-AIMS HTTP Service'
      description: 'Sys-AIMS: Docker 소켓 없이 HTTP로 서비스 가용성을 감시 (ADR-0001)'
      groups:
        - name: Templates/Sys-AIMS
      items:
        - uuid: 51095d68f29448b08031b2ac61c28377
          name: 'HTTP status code'
          type: HTTP_AGENT
          key: http.status.code
          delay: '{$HTTP.CHECK.INTERVAL}'
          history: 7d
          trends: 90d
          description: '0 = 연결 실패/타임아웃, 그 외 = HTTP 상태 코드'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: REGEX
              parameters:
                - 'HTTP\/[\d.]+\s+(\d{3})'
                - \1
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          timeout: '{$HTTP.CHECK.TIMEOUT}'
          url: '{$SERVICE.URL}'
          status_codes: ''
          follow_redirects: 'NO'
          retrieve_mode: HEADERS
          tags:
            - tag: component
              value: http
          triggers:
            - uuid: 90980be78a2d47148c85f9be9ddb90a9
              expression: 'count(/Sys-AIMS HTTP Service/http.status.code,#2,"ne","200")=2'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Sys-AIMS HTTP Service/http.status.code)=200'
              name: '{HOST.NAME}: HTTP service is down'
              opdata: 'Status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: '최근 2회 연속 HTTP 200이 아니면 발생 (0 = 연결 실패). healing={$HEALING.MODE} 태그로 자동 복구 여부 결정.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: http
                - tag: healing
                  value: '{$HEALING.MODE}'
                - tag: scope
                  value: availability
      macros:
        - macro: '{$HEALING.MODE}'
          value: auto
          description: '자동 복구 여부 (auto | off)'
        - macro: '{$HTTP.CHECK.INTERVAL}'
          value: 15s
          description: 'HTTP 체크 주기'
        - macro: '{$HTTP.CHECK.TIMEOUT}'
          value: 5s
          description: 'HTTP 응답 타임아웃'
        - macro: '{$SERVICE.URL}'
          value: 'http://localhost/'
          description: '감시 대상 URL (호스트에서 재정의)'
