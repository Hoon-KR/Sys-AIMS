# /reports/ — AI 일일 점검 보고서 (docs/daily-report.md)
# reporter 가 reports_data 볼륨에 .md / .html / .json 과 index.html 을 만든다.
# 이 파일은 prod 서버 블록(HTTPS)에서 include 한다:  include /etc/nginx/snippets/reports.conf;
#   필요한 마운트: reports_data:/srv/reports:ro , ./nginx/auth:/etc/nginx/auth:ro (htpasswd, gitignore)
location /reports/ {
    alias /srv/reports/;
    index index.html;

    # 보고서에 호스트명·에러 로그가 들어가므로 인증 필수
    auth_basic "Sys-AIMS Reports";
    auth_basic_user_file /etc/nginx/auth/reports.htpasswd;

    autoindex off;
    charset utf-8;
    charset_types text/markdown application/json;
    types {
        text/html        html;
        text/markdown    md;
        application/json json;
    }
    default_type text/plain;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    # 내부 상태(.state 호출 한도, .events 생성 기록)는 노출하지 않는다
    location ~ /\. {
        deny all;
    }
}
