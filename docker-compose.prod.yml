# =============================================================
# Sys-AIMS — 프로덕션 override (AWS EC2, HTTPS)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# local override와의 차이
#   - 외부 공개는 nginx(80/443)만 한다. zabbix-web은 127.0.0.1에만 바인딩한다
#     (호스트에서 scripts/zabbix_config.py 를 실행하기 위한 통로. 외부에서는 닿지 않는다).
#   - pitwall_web/api는 호스트에 포트를 열지 않는다. 감시는 컨테이너 망 안에서 이뤄진다.
#   - certbot(Let's Encrypt)과 duckdns(동적 IP 갱신)를 추가한다.
#
# 메모리 예산 (docs/aws-migration.md): base 976M + nginx 32M + certbot 64M + duckdns 16M ≒ 1.09G
# =============================================================

# 로그 로테이션: 앵커는 파일 단위라 base와 별개로 다시 정의한다 (값은 동일하게 유지)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # nginx가 프록시할 수 있도록 공개 진입점 망(zbx_front)에 합류시킨다.
  zabbix-web:
    ports:
      # 루프백 전용. 외부에는 열리지 않는다 (0.0.0.0 바인딩 금지).
      - "127.0.0.1:${ZABBIX_WEB_PORT:?ZABBIX_WEB_PORT is required}:8080"
    networks:
      - zbx_db
      - zbx_mon
      - zbx_front

  # -----------------------------------------------------------
  # 자동 복구 대상 컨테이너를 이름으로 재기동하므로, prod에서도
  # zabbix-server는 그대로 둔다. 감시 대상이 별도 VM(VM-A/VM-B)으로
  # 분리되면 Agent(액티브)가 이 서버의 10051로 접속해야 한다.
  # 그때 아래 주석을 풀고, 보안 그룹은 0.0.0.0/0이 아니라
  # VPC 내부 CIDR(예: 172.31.0.0/16)에만 10051을 허용한다.
  # -----------------------------------------------------------
  # zabbix-server:
  #   ports:
  #     - "10051:10051"

  # -----------------------------------------------------------
  # nginx — 유일한 공개 진입점
  #   :80  ACME 챌린지 + HTTPS 리다이렉트          (nginx/conf.d/prod/00-acme.conf)
  #   :443 Zabbix Web 프록시 + /reports/ (Basic Auth)
  #        (nginx/conf.d/prod/10-https.conf — 인증서 발급 후 .off 파일을 복사해 활성화)
  # 인증서 갱신을 반영하려고 6시간마다 스스로 reload 한다.
  # -----------------------------------------------------------
  nginx:
    image: nginx:1.30.5-alpine3.24
    container_name: nginx
    restart: unless-stopped
    depends_on:
      zabbix-web:
        condition: service_healthy
    environment:
      TZ: ${TZ:?TZ is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/prod:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/auth:/etc/nginx/auth:ro          # reports.htpasswd (서버에서 생성, gitignore)
      - reports_data:/srv/reports:ro             # reporter가 쓰고 nginx는 읽기만 한다
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command:
      - /bin/sh
      - -c
      - |
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        exec nginx -g 'daemon off;'
    networks:
      - zbx_front
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 32M
    logging: *default-logging

  # -----------------------------------------------------------
  # certbot — Let's Encrypt 인증서 자동 갱신 (webroot 방식)
  # 최초 발급은 수동 1회 (docs/aws-migration.md 6장):
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #     run --rm --entrypoint certbot certbot certonly --webroot -w /var/www/certbot -d <도메인> ...
  # 갱신은 12시간마다 시도하고, 만료 30일 전부터 실제로 갱신된다.
  # 갱신된 인증서는 nginx의 6시간 주기 reload가 반영한다.
  # -----------------------------------------------------------
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: certbot
    restart: unless-stopped
    environment:
      TZ: ${TZ:?TZ is required}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_lib:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --no-random-sleep-on-renew
          sleep 12h & wait $${!}
        done
    networks:
      - egress   # ACME 서버 (Let's Encrypt)
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *default-logging

  # -----------------------------------------------------------
  # duckdns — 퍼블릭 IP 자동 갱신 (탄력적 IP 대체)
  # 인스턴스를 중지/시작하면 퍼블릭 IP가 바뀐다. 5분마다 DuckDNS에
  # 현재 IP를 알려 도메인이 계속 이 인스턴스를 가리키게 한다.
  #   ip= 를 비워 보내면 DuckDNS가 요청의 출발지 IP를 쓴다 → IP를 직접 알 필요가 없다.
  # 토큰은 .env에서만 읽고 로그에 남기지 않는다 (응답 OK/KO 만 출력).
  # -----------------------------------------------------------
  duckdns:
    image: curlimages/curl:8.22.0
    container_name: duckdns
    restart: unless-stopped
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:?DUCKDNS_DOMAIN is required}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DUCKDNS_TOKEN is required}
      DUCKDNS_INTERVAL_SECONDS: ${DUCKDNS_INTERVAL_SECONDS:-300}
      TZ: ${TZ:?TZ is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM
        while :; do
          result=$$(curl -s --max-time 20 \
            "https://www.duckdns.org/update?domains=$${DUCKDNS_DOMAIN}&token=$${DUCKDNS_TOKEN}&ip=") \
            || result="curl failed ($$?)"
          # curl 이미지에는 tzdata가 없어 TZ가 먹지 않는다 → UTC로 명시해 오해를 막는다
          echo "$$(date -u '+%F %T')Z duckdns $${DUCKDNS_DOMAIN}: $${result}"
          sleep $${DUCKDNS_INTERVAL_SECONDS} & wait $${!}
        done
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - egress
    deploy:
      resources:
        limits:
          memory: 16M
    logging: *default-logging

networks:
  # 공개 진입점 망: nginx ↔ zabbix-web.
  # internal로 두면 공개 포트(80/443)의 외부 유입이 막히므로 일반 bridge로 둔다.
  zbx_front:

volumes:
  certbot_conf:   # /etc/letsencrypt (인증서, 갱신 설정)
  certbot_lib:    # /var/lib/letsencrypt (작업 디렉터리)
  certbot_www:    # ACME 챌린지 파일 (nginx가 읽기 전용으로 서빙)
