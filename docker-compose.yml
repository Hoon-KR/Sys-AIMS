# =============================================================
# Sys-AIMS — Docker Compose (공통 base)
#
# 단독 실행하지 않는다. 환경별 override와 함께 사용한다:
#   local : docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   prod  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d  (예정)
#
# base에는 포트를 노출하지 않는다. 외부 노출은 override의 책임이다.
# 환경마다 달라지는 값과 시크릿은 .env에서 주입한다 (cp .env.example .env).
# 서비스명, 튜닝값, 보안 정책 같은 구조 설정은 리뷰 가능하도록 이 파일에 고정한다.
#
# 이미지 버전 (모두 arm64 manifest 확인 — M1 / t4g 공통):
#   postgres:16.15-alpine3.24        Zabbix 7.0 지원 범위 내 메이저, alpine 경량
#   zabbix-*:alpine-7.0.30           7.0 LTS 최신 패치. server/web/agent 버전 일치 필수
#   nginx:1.30.5-alpine3.24          stable 브랜치, 정적 페이지 서빙용 최소 이미지
# =============================================================

name: sys-aims

# 로그 로테이션: EC2 소용량 디스크에서 docker 로그가 무한히 쌓이지 않도록
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Zabbix DB 접속 정보 (server / web 공통)
x-zabbix-db-env: &zabbix-db-env
  DB_SERVER_HOST: postgres
  DB_SERVER_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

services:
  # -----------------------------------------------------------
  # PostgreSQL — Zabbix DB
  # -----------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine3.24
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:?TZ is required}
    volumes:
      - ./zbx_env/var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      - zbx_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # -----------------------------------------------------------
  # Zabbix Server
  # 첫 기동 시 DB 스키마를 생성하므로 postgres가 healthy일 때만 시작한다.
  # -----------------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.30
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *zabbix-db-env
      TZ: ${TZ:?TZ is required}
      # 소규모(호스트 수 대) 환경 기준으로 프로세스 수 축소 → 메모리/DB 커넥션 절약
      ZBX_STARTPOLLERS: "2"
      ZBX_STARTPOLLERSUNREACHABLE: "1"
      ZBX_STARTTRAPPERS: "2"
      ZBX_STARTPINGERS: "1"
      ZBX_STARTDISCOVERERS: "1"
      ZBX_STARTHTTPAGENTPOLLERS: "1"
      ZBX_STARTAGENTPOLLERS: "1"
      ZBX_STARTPREPROCESSORS: "2"
      ZBX_STARTDBSYNCERS: "2"
      ZBX_STARTLLDPROCESSORS: "1"
    volumes:
      # Action이 호출하는 래퍼 스크립트 (실제 로직은 automation/)
      - ./zabbix/alertscripts:/usr/lib/zabbix/alertscripts:ro
      - ./zabbix/externalscripts:/usr/lib/zabbix/externalscripts:ro
    networks:
      - zbx_db
      - zbx_mon
      - zbx_heal   # Action webhook → healer 호출용
    healthcheck:
      # 스키마 생성이 끝나야 trapper 포트(10051)가 열린다 → 포트 open = 준비 완료
      test: ["CMD", "nc", "-z", "127.0.0.1", "10051"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *default-logging

  # -----------------------------------------------------------
  # Zabbix Web (nginx + php-fpm), 컨테이너 내부 포트 8080
  # -----------------------------------------------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.30
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    environment:
      <<: *zabbix-db-env
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: Sys-AIMS
      PHP_TZ: ${TZ:?TZ is required}
      TZ: ${TZ:?TZ is required}
    networks:
      - zbx_db
      - zbx_mon
    healthcheck:
      # /ping 은 nginx → php-fpm 경로를 모두 통과해야 "pong"을 반환
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  # -----------------------------------------------------------
  # Zabbix Agent 2 — 호스트 메트릭 수집
  # Docker 소켓은 의도적으로 마운트하지 않는다.
  # (docs/adr/0001-docker-socket-access.md 참고)
  # -----------------------------------------------------------
  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0.30
    container_name: zabbix-agent
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_healthy
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
      # 원격 명령(system.run) 차단을 명시 — 복구는 Agent가 아닌 전용 경로로 수행
      ZBX_DENYKEY: "system.run[*]"
      TZ: ${TZ:?TZ is required}
    networks:
      - zbx_mon
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10050"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging

  # -----------------------------------------------------------
  # pitwall_web — 모니터링 대상 샘플 서비스
  # 컨테이너명은 .env의 TARGET_CONTAINER 와 반드시 일치해야 한다.
  # -----------------------------------------------------------
  pitwall_web:
    image: nginx:1.30.5-alpine3.24
    container_name: pitwall_web
    # ⚠️ 이 서비스만 restart: "no" 인 이유
    #   Self-Healing의 주체는 Docker가 아니라 Zabbix(Trigger → Action)여야 한다.
    #   restart 정책이 있으면 Docker가 먼저 컨테이너를 되살려서
    #     1) Zabbix가 장애를 감지하기도 전에 복구되어 버리고
    #     2) "Zabbix Action이 복구했다"는 사실을 검증/증명할 수 없다.
    #   따라서 장애 시 컨테이너는 죽은 채로 남고, 오직 Zabbix Action만 재기동한다.
    restart: "no"
    environment:
      TZ: ${TZ:?TZ is required}
    volumes:
      - ./services/pitwall_web/html:/usr/share/nginx/html:ro
    networks:
      - zbx_mon
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *default-logging

  # -----------------------------------------------------------
  # socket-proxy — 원본 Docker 소켓을 가진 유일한 컨테이너 (ADR-0001)
  # 허용 목록(정규식)에 없는 요청은 모두 거부한다:
  #   GET  /containers/<TARGET_CONTAINER>/json      (재기동 후 상태 확인)
  #   POST /containers/<TARGET_CONTAINER>/restart   (재기동)
  # 정규식은 프록시가 ^...$ 로 감싸 전체 경로 일치로 검사한다 (부분 일치 불가).
  # 접속은 healer 컨테이너에서만 허용 (-allowfrom), 외부 포트 없음.
  # -----------------------------------------------------------
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: socket-proxy
    restart: unless-stopped
    command:
      - "-loglevel=INFO"
      - "-listenip=0.0.0.0"
      - "-allowfrom=healer"
      - "-allowGET=/v1\\.[0-9]+/containers/${TARGET_CONTAINER:?TARGET_CONTAINER is required}/json"
      - "-allowPOST=/v1\\.[0-9]+/containers/${TARGET_CONTAINER:?TARGET_CONTAINER is required}/restart"
      - "-allowhealthcheck"
      - "-watchdoginterval=30"
      - "-stoponwatchdog"
    # 이미지는 비root(65534)로 실행된다. 소켓(권한 660)의 소유 그룹을 추가해야 접근 가능:
    #   Docker Desktop(맥) → root:root  → DOCKER_GID=0
    #   EC2(Amazon Linux)  → root:docker → DOCKER_GID=$(getent group docker | cut -d: -f3)
    # (docs/aws-migration.md 참고)
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required}"
    volumes:
      # :ro 는 소켓 파일 보호일 뿐 API 제한이 아니다. 제한은 위 허용 목록이 담당한다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - docker_api
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32M
    logging: *default-logging

  # -----------------------------------------------------------
  # healer — Zabbix Action(webhook)의 재기동 요청을 처리 (automation/healing)
  # Docker 접근은 socket-proxy 경유만 가능. 서킷 브레이커로 무한 재기동 방지.
  # -----------------------------------------------------------
  healer:
    build:
      context: ./automation
    image: sys-aims/healer:local
    container_name: healer
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      TARGET_CONTAINER: ${TARGET_CONTAINER:?TARGET_CONTAINER is required}
      HEALER_TOKEN: ${HEALER_TOKEN:?HEALER_TOKEN is required}
      HEALER_MAX_RESTARTS: ${HEALER_MAX_RESTARTS:?HEALER_MAX_RESTARTS is required}
      HEALER_WINDOW_SECONDS: ${HEALER_WINDOW_SECONDS:?HEALER_WINDOW_SECONDS is required}
      HEALER_COOLDOWN_SECONDS: ${HEALER_COOLDOWN_SECONDS:?HEALER_COOLDOWN_SECONDS is required}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DOCKER_PROXY_HOST: socket-proxy
      STATE_FILE: /data/state.json
      # 재기동/서킷 이력 (JSON Lines, 5MB × 5 로테이션). RCA도 같은 디렉터리에 rca.jsonl 로 남긴다.
      EVENT_LOG_DIR: /data/events
      TZ: ${TZ:?TZ is required}
    volumes:
      # 서킷 상태 + 이벤트 이력 보존용 (컨테이너/이미지를 재생성해도 유지).
      # bind mount 대신 named volume을 쓰는 이유:
      # 리눅스에서 docker가 만든 bind 디렉터리는 root 소유라 비root(10001) 프로세스가 쓸 수 없다.
      # named volume은 이미지의 /data 소유권(app)을 그대로 이어받는다.
      - automation_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - zbx_heal     # zabbix-server → healer
      - docker_api   # healer → socket-proxy
      - egress       # Slack 알림
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *default-logging

networks:
  # DB 전용 망: 외부 통신 불가. postgres는 이 망에만 존재한다.
  zbx_db:
    internal: true
  # 모니터링 망: server ↔ agent ↔ 대상 서비스
  zbx_mon:
  # Self-Healing 호출 망: zabbix-server ↔ healer
  zbx_heal:
    internal: true
  # Docker API 망: healer ↔ socket-proxy (소켓 프록시는 이 망에만 존재)
  docker_api:
    internal: true
  # 외부 통신 망: healer의 Slack 알림
  egress:

volumes:
  automation_data:
