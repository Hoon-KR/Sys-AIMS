# =============================================================
# :80 — ACME(Let's Encrypt) 챌린지와 HTTPS 리다이렉트 전용
#
# 인증서가 아직 없는 부트스트랩 단계에서도 이 파일만으로 nginx가 뜬다.
# (HTTPS 서버 블록은 인증서 발급 뒤 10-https.conf 로 활성화한다)
# =============================================================

# 응답 헤더에 nginx 버전을 노출하지 않는다
server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    # 컨테이너 헬스체크용 내부 경로 (도메인·인증서와 무관하게 항상 200)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # certbot(webroot)이 이 디렉터리에 챌린지 파일을 쓴다.
    # 갱신 때도 이 경로가 평문 80으로 열려 있어야 한다 → 리다이렉트보다 먼저 매칭된다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
