# =============================================================
# Sys-AIMS — Docker Compose (공통 base)
#
# 단독 실행하지 않는다. 환경별 override와 함께 사용한다:
#   local : docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   prod  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d  (예정)
#
# base에는 포트를 노출하지 않는다. 외부 노출은 override의 책임이다.
# 환경마다 달라지는 값과 시크릿은 .env에서 주입한다 (cp .env.example .env).
# 서비스명, 튜닝값, 보안 정책 같은 구조 설정은 리뷰 가능하도록 이 파일에 고정한다.
#
# 이미지 버전 (모두 amd64 + arm64 멀티 아키텍처 확인 — 로컬 M1(arm64) / EC2 t3.small(x86) 공통):
#   postgres:16.15-alpine3.24        Zabbix 7.0 지원 범위 내 메이저, alpine 경량
#   zabbix-*:alpine-7.0.30           7.0 LTS 최신 패치. server/web/agent 버전 일치 필수
#   nginx:1.30.5-alpine3.24          stable 브랜치, 정적 페이지 서빙용 최소 이미지
# =============================================================

name: sys-aims

# 메모리 상한 (EC2 t3.small = 2GB RAM + 스왑 2GB, docs/aws-migration.md "메모리 예산")
#   실측 peak(memory.peak) 대비 여유를 두되 합계 약 1GB (Nginx·certbot 추가 시 약 1.07GB)
#   postgres 320 / zabbix-server 128 / zabbix-web 160 / agent 64 / reporter 96 / rca 64 /
#   healer 48 / socket-proxy 32 / pitwall_web 32 / pitwall_api 32  (MB)

# 로그 로테이션: EC2 소용량 디스크에서 docker 로그가 무한히 쌓이지 않도록
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Zabbix DB 접속 정보 (server / web 공통)
x-zabbix-db-env: &zabbix-db-env
  DB_SERVER_HOST: postgres
  DB_SERVER_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

services:
  # -----------------------------------------------------------
  # PostgreSQL — Zabbix DB
  # -----------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine3.24
    container_name: postgres
    restart: unless-stopped
    # 2GB 인스턴스용 메모리 억제 (실측: 연결 31개 중 Zabbix 27개, shared_buffers 사용 83MB)
    #   shared_buffers 128MB→64MB : 공유 메모리 상한. 데이터가 쌓여도 이 이상 커지지 않는다
    #   max_connections 100→50    : 연결당 메모리 상한 (Zabbix 27 + web 최대 6 + 여유)
    #   work_mem 2MB / maintenance_work_mem 32MB : 정렬·housekeeper 삭제 시 순간 사용량 억제
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=192MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:?TZ is required}
    volumes:
      - ./zbx_env/var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      - zbx_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 320M
    logging: *default-logging

  # -----------------------------------------------------------
  # Zabbix Server
  # 첫 기동 시 DB 스키마를 생성하므로 postgres가 healthy일 때만 시작한다.
  # -----------------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.30
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *zabbix-db-env
      TZ: ${TZ:?TZ is required}
      # 소규모(호스트 수 대) 환경 기준으로 프로세스 수 축소 → 메모리/DB 커넥션 절약
      ZBX_STARTPOLLERS: "2"
      ZBX_STARTPOLLERSUNREACHABLE: "1"
      ZBX_STARTTRAPPERS: "2"
      ZBX_STARTPINGERS: "1"
      ZBX_STARTDISCOVERERS: "1"
      ZBX_STARTHTTPAGENTPOLLERS: "1"
      ZBX_STARTAGENTPOLLERS: "1"
      ZBX_STARTPREPROCESSORS: "2"
      ZBX_STARTDBSYNCERS: "2"
      ZBX_STARTLLDPROCESSORS: "1"
    volumes:
      # Action이 호출하는 래퍼 스크립트 (실제 로직은 automation/)
      - ./zabbix/alertscripts:/usr/lib/zabbix/alertscripts:ro
      - ./zabbix/externalscripts:/usr/lib/zabbix/externalscripts:ro
    networks:
      - zbx_db
      - zbx_mon
      - zbx_heal   # Action webhook → healer 호출용
    healthcheck:
      # 스키마 생성이 끝나야 trapper 포트(10051)가 열린다 → 포트 open = 준비 완료
      test: ["CMD", "nc", "-z", "127.0.0.1", "10051"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging

  # -----------------------------------------------------------
  # Zabbix Web (nginx + php-fpm), 컨테이너 내부 포트 8080
  # -----------------------------------------------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.30
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    environment:
      <<: *zabbix-db-env
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: Sys-AIMS
      PHP_TZ: ${TZ:?TZ is required}
      # php-fpm 워커 제한: 이미지 기본값은 최대 50개(워커당 약 35MB) → 트래픽이 몰리면 2GB를 넘길 수 있다
      PHP_FPM_PM: dynamic
      PHP_FPM_PM_MAX_CHILDREN: "6"
      PHP_FPM_PM_START_SERVERS: "2"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "1"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "3"
      PHP_FPM_PM_MAX_REQUESTS: "500"   # 워커 재생성으로 메모리 누적 방지
      TZ: ${TZ:?TZ is required}
    networks:
      - zbx_db
      - zbx_mon
    healthcheck:
      # /ping 은 nginx → php-fpm 경로를 모두 통과해야 "pong"을 반환
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 160M
    logging: *default-logging

  # -----------------------------------------------------------
  # Zabbix Agent 2 — 호스트 메트릭 수집
  # Docker 소켓은 의도적으로 마운트하지 않는다.
  # (docs/adr/0001-docker-socket-access.md 참고)
  # -----------------------------------------------------------
  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0.30
    container_name: zabbix-agent
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_healthy
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
      # 원격 명령(system.run) 차단을 명시 — 복구는 Agent가 아닌 전용 경로로 수행
      ZBX_DENYKEY: "system.run[*]"
      TZ: ${TZ:?TZ is required}
    networks:
      - zbx_mon
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10050"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *default-logging

  # -----------------------------------------------------------
  # pitwall_web — 모니터링 대상 샘플 서비스
  # 컨테이너명은 .env의 TARGET_CONTAINER 와 반드시 일치해야 한다.
  # -----------------------------------------------------------
  pitwall_web:
    image: nginx:1.30.5-alpine3.24
    container_name: pitwall_web
    # ⚠️ 이 서비스만 restart: "no" 인 이유
    #   Self-Healing의 주체는 Docker가 아니라 Zabbix(Trigger → Action)여야 한다.
    #   restart 정책이 있으면 Docker가 먼저 컨테이너를 되살려서
    #     1) Zabbix가 장애를 감지하기도 전에 복구되어 버리고
    #     2) "Zabbix Action이 복구했다"는 사실을 검증/증명할 수 없다.
    #   따라서 장애 시 컨테이너는 죽은 채로 남고, 오직 Zabbix Action만 재기동한다.
    restart: "no"
    depends_on:
      pitwall_api:
        condition: service_healthy
    environment:
      TZ: ${TZ:?TZ is required}
    volumes:
      - ./services/pitwall_web/html:/usr/share/nginx/html:ro
      # 서버 설정 (딥 헬스체크 /healthz → pitwall_api). 장애 시나리오 ②는 이 디렉터리에 잘못된 설정을 주입한다.
      - ./services/pitwall_web/conf.d:/etc/nginx/conf.d:ro
    networks:
      - zbx_mon
    healthcheck:
      # 딥 헬스체크: 의존 서비스(pitwall_api)까지 응답해야 healthy
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32M
    logging: *default-logging

  # -----------------------------------------------------------
  # pitwall_api — pitwall_web 의 의존 서비스 (장애 시나리오 ①의 대상, docs/chaos-scenarios.md)
  # 자동 복구 대상이 아니다 (TARGET_CONTAINER 아님, socket-proxy 허용 목록 밖).
  # -----------------------------------------------------------
  pitwall_api:
    image: nginx:1.30.5-alpine3.24
    container_name: pitwall_api
    restart: unless-stopped
    environment:
      TZ: ${TZ:?TZ is required}
    volumes:
      - ./services/pitwall_api/html:/usr/share/nginx/html:ro
    networks:
      - zbx_mon
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/status.json"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32M
    logging: *default-logging

  # -----------------------------------------------------------
  # socket-proxy — 원본 Docker 소켓을 가진 유일한 컨테이너 (ADR-0001)
  # 허용 목록(정규식)에 없는 요청은 모두 거부한다:
  #   GET  /containers/<TARGET_CONTAINER>/json      (재기동 전 상태 스냅샷, 재기동 후 확인)
  #   GET  /containers/<TARGET_CONTAINER>/logs      (재기동 전 로그 스냅샷 → RCA)
  #   POST /containers/<TARGET_CONTAINER>/restart   (재기동)
  # 정규식은 프록시가 ^...$ 로 감싸 전체 경로 일치로 검사한다 (부분 일치 불가).
  # 접속은 healer 컨테이너에서만 허용 (-allowfrom), 외부 포트 없음.
  # -----------------------------------------------------------
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: socket-proxy
    restart: unless-stopped
    command:
      - "-loglevel=INFO"
      - "-listenip=0.0.0.0"
      - "-allowfrom=healer"
      - "-allowGET=/v1\\.[0-9]+/containers/${TARGET_CONTAINER:?TARGET_CONTAINER is required}/(json|logs)"
      - "-allowPOST=/v1\\.[0-9]+/containers/${TARGET_CONTAINER:?TARGET_CONTAINER is required}/restart"
      - "-allowhealthcheck"
      - "-watchdoginterval=30"
      - "-stoponwatchdog"
    # 이미지는 비root(65534)로 실행된다. 소켓(권한 660)의 소유 그룹을 추가해야 접근 가능:
    #   Docker Desktop(맥) → root:root  → DOCKER_GID=0
    #   EC2(Ubuntu)        → root:docker → DOCKER_GID=$(getent group docker | cut -d: -f3)
    # (docs/aws-migration.md 참고)
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required}"
    volumes:
      # :ro 는 소켓 파일 보호일 뿐 API 제한이 아니다. 제한은 위 허용 목록이 담당한다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - docker_api
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32M
    logging: *default-logging

  # -----------------------------------------------------------
  # healer — Zabbix Action(webhook)의 재기동 요청을 처리 (automation/healing)
  # Docker 접근은 socket-proxy 경유만 가능. 서킷 브레이커로 무한 재기동 방지.
  # -----------------------------------------------------------
  healer:
    build:
      context: ./automation
      target: base   # 외부 패키지 없는 이미지 (reporter 전용 의존성 제외)
    image: sys-aims/automation:local
    container_name: healer
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      TARGET_CONTAINER: ${TARGET_CONTAINER:?TARGET_CONTAINER is required}
      HEALER_TOKEN: ${HEALER_TOKEN:?HEALER_TOKEN is required}
      HEALER_MAX_RESTARTS: ${HEALER_MAX_RESTARTS:?HEALER_MAX_RESTARTS is required}
      HEALER_WINDOW_SECONDS: ${HEALER_WINDOW_SECONDS:?HEALER_WINDOW_SECONDS is required}
      HEALER_COOLDOWN_SECONDS: ${HEALER_COOLDOWN_SECONDS:?HEALER_COOLDOWN_SECONDS is required}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # rca 호출용. HEALER_TOKEN과 다른 값 — healer가 뚫려도 같은 토큰으로 rca에 접근할 수 없게
      RCA_TOKEN: ${RCA_TOKEN:?RCA_TOKEN is required}
      DOCKER_PROXY_HOST: socket-proxy
      STATE_FILE: /data/state.json
      # 재기동/서킷 이력 (JSON Lines, 5MB × 5 로테이션). RCA도 같은 디렉터리에 rca.jsonl 로 남긴다.
      EVENT_LOG_DIR: /data/events
      TZ: ${TZ:?TZ is required}
    volumes:
      # 서킷 상태 + 이벤트 이력 보존용 (컨테이너/이미지를 재생성해도 유지).
      # bind mount 대신 named volume을 쓰는 이유:
      # 리눅스에서 docker가 만든 bind 디렉터리는 root 소유라 비root(10001) 프로세스가 쓸 수 없다.
      # named volume은 이미지의 /data 소유권(app)을 그대로 이어받는다.
      - automation_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - zbx_heal     # zabbix-server → healer, healer → rca
      - docker_api   # healer → socket-proxy
      - egress       # Slack 알림
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 48M
    logging: *default-logging

  # -----------------------------------------------------------
  # rca — 장애 직전 로그를 OpenAI로 분석해 Slack 전송 (automation/rca, docs/rca.md)
  # 권한 분리: OpenAI 키는 여기에만 있고, Docker 접근은 없다 (docker_api 망에 없음).
  # healer가 재기동 전에 뜬 로그 스냅샷을 받아서 분석만 한다.
  # -----------------------------------------------------------
  rca:
    build:
      context: ./automation
      target: base   # 외부 패키지 없는 이미지 (reporter 전용 의존성 제외)
    image: sys-aims/automation:local
    container_name: rca
    restart: unless-stopped
    command: ["python", "-m", "rca.server"]
    environment:
      RCA_TOKEN: ${RCA_TOKEN:?RCA_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:?OPENAI_MODEL is required}
      RCA_MAX_PER_DAY: ${RCA_MAX_PER_DAY:?RCA_MAX_PER_DAY is required}
      RCA_MAX_LOG_CHARS: ${RCA_MAX_LOG_CHARS:?RCA_MAX_LOG_CHARS is required}
      RCA_MAX_OUTPUT_TOKENS: ${RCA_MAX_OUTPUT_TOKENS:?RCA_MAX_OUTPUT_TOKENS is required}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      RCA_STATE_FILE: /data/rca_state.json
      EVENT_LOG_DIR: /data/events
      TZ: ${TZ:?TZ is required}
    volumes:
      - automation_data:/data   # rca.jsonl 은 healer.jsonl 과 같은 디렉터리 (event_id로 연결)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - zbx_heal   # healer → rca, zabbix-server → rca(/health 감시)
      - egress     # OpenAI, Slack
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *default-logging

  # -----------------------------------------------------------
  # reporter — AI 일일 점검 보고서 (automation/daily_report, docs/daily-report.md)
  # 매일 REPORT_TIME 에 생성 (컨테이너 내부 스케줄러, 놓친 실행 따라잡기).
  # Zabbix 는 읽기 전용 계정만 가진다 (Super admin 없음). 장애 이력은 읽기 전용으로 마운트.
  # -----------------------------------------------------------
  reporter:
    build:
      context: ./automation
      target: reporter   # base + markdown (해시 고정, automation/requirements/reporter.txt)
    image: sys-aims/reporter:local
    container_name: reporter
    restart: unless-stopped
    depends_on:
      zabbix-web:
        condition: service_healthy
    environment:
      REPORT_ZABBIX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZABBIX_REPORT_USER: ${ZABBIX_REPORT_USER:?ZABBIX_REPORT_USER is required}
      ZABBIX_REPORT_PASSWORD: ${ZABBIX_REPORT_PASSWORD:?ZABBIX_REPORT_PASSWORD is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:?OPENAI_MODEL is required}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      REPORT_TIME: ${REPORT_TIME:?REPORT_TIME is required}
      REPORT_MAX_PER_DAY: ${REPORT_MAX_PER_DAY:?REPORT_MAX_PER_DAY is required}
      REPORT_MAX_OUTPUT_TOKENS: ${REPORT_MAX_OUTPUT_TOKENS:?REPORT_MAX_OUTPUT_TOKENS is required}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:?REPORT_RETENTION_DAYS is required}
      # 외부 열람 주소 (prod: https://<도메인>/reports). 비어 있으면 Slack 에 파일명만 표시
      REPORT_BASE_URL: ${REPORT_BASE_URL:-}
      REPORTS_DIR: /reports
      EVENTS_DIR: /data/events
      TZ: ${TZ:?TZ is required}
    volumes:
      - automation_data:/data:ro   # healer.jsonl / rca.jsonl 읽기 전용 (장애 기록 변조 방지)
      - reports_data:/reports      # 보고서 (prod 에서 nginx 가 읽기 전용으로 서빙)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - zbx_mon   # zabbix-web API
      - egress    # OpenAI, Slack
    healthcheck:
      test: ["CMD", "pgrep", "-f", "daily_report.scheduler"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 96M
    logging: *default-logging

networks:
  # DB 전용 망: 외부 통신 불가. postgres는 이 망에만 존재한다.
  zbx_db:
    internal: true
  # 모니터링 망: server ↔ agent ↔ 대상 서비스
  zbx_mon:
  # Self-Healing 호출 망: zabbix-server ↔ healer ↔ rca
  zbx_heal:
    internal: true
  # Docker API 망: healer ↔ socket-proxy (소켓 프록시는 이 망에만 존재)
  docker_api:
    internal: true
  # 외부 통신 망: healer/rca/reporter 의 Slack 알림, rca/reporter 의 OpenAI 호출
  egress:

volumes:
  automation_data:
  reports_data:
